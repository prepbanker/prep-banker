<svg xmlns="http://www.w3.org/2000/svg" width="650" height="400" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="650" height="400" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
  
  <text x="325" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#212121">Production of Wheat and Rice (in thousand tons) from 2018 to 2022</text>

  <!-- Legend -->
  <rect x="220" y="50" width="15" height="15" fill="#1e88e5"/>
  <text x="245" y="62" font-size="12" fill="#212121">Wheat</text>
  <rect x="340" y="50" width="15" height="15" fill="#ff8f00"/>
  <text x="365" y="62" font-size="12" fill="#212121">Rice</text>

  <!-- Y-Axis & X-Axis -->
  <line x1="60" y1="90" x2="60" y2="340" stroke="#424242" stroke-width="2"/>
  <line x1="60" y1="340" x2="600" y2="340" stroke="#424242" stroke-width="2"/>

  <!-- Y-Axis Grid & Labels -->
  <g font-size="12" fill="#616161" text-anchor="end">
    <!-- 0 -->
    <text x="50" y="344">0</text>
    <!-- 100 -->
    <line x1="60" y1="290" x2="600" y2="290" stroke="#eeeeee" stroke-width="1"/>
    <text x="50" y="294">100</text>
    <!-- 200 -->
    <line x1="60" y1="240" x2="600" y2="240" stroke="#eeeeee" stroke-width="1"/>
    <text x="50" y="244">200</text>
    <!-- 300 -->
    <line x1="60" y1="190" x2="600" y2="190" stroke="#eeeeee" stroke-width="1"/>
    <text x="50" y="194">300</text>
    <!-- 400 -->
    <line x1="60" y1="140" x2="600" y2="140" stroke="#eeeeee" stroke-width="1"/>
    <text x="50" y="144">400</text>
    <!-- 500 -->
    <line x1="60" y1="90" x2="600" y2="90" stroke="#eeeeee" stroke-width="1"/>
    <text x="50" y="94">500</text>
  </g>

  <!-- Bars and Values -->
  <g font-size="11" font-weight="bold" fill="#424242" text-anchor="middle">
    <!-- 2018 (X=110) -->
    <!-- Wheat: 250 -> H: 125, Y: 340-125=215 -->
    <rect x="90" y="215" width="30" height="125" fill="#1e88e5"/>
    <text x="105" y="210">250</text>
    <!-- Rice: 320 -> H: 160, Y: 340-160=180 -->
    <rect x="120" y="180" width="30" height="160" fill="#ff8f00"/>
    <text x="135" y="175">320</text>
    <text x="120" y="360" font-size="14">2018</text>

    <!-- 2019 (X=210) -->
    <!-- Wheat: 350 -> H: 175, Y: 165 -->
    <rect x="190" y="165" width="30" height="175" fill="#1e88e5"/>
    <text x="205" y="160">350</text>
    <!-- Rice: 280 -> H: 140, Y: 200 -->
    <rect x="220" y="200" width="30" height="140" fill="#ff8f00"/>
    <text x="235" y="195">280</text>
    <text x="220" y="360" font-size="14">2019</text>

    <!-- 2020 (X=310) -->
    <!-- Wheat: 400 -> H: 200, Y: 140 -->
    <rect x="290" y="140" width="30" height="200" fill="#1e88e5"/>
    <text x="305" y="135">400</text>
    <!-- Rice: 450 -> H: 225, Y: 115 -->
    <rect x="320" y="115" width="30" height="225" fill="#ff8f00"/>
    <text x="335" y="110">450</text>
    <text x="320" y="360" font-size="14">2020</text>

    <!-- 2021 (X=410) -->
    <!-- Wheat: 380 -> H: 190, Y: 150 -->
    <rect x="390" y="150" width="30" height="190" fill="#1e88e5"/>
    <text x="405" y="145">380</text>
    <!-- Rice: 410 -> H: 205, Y: 135 -->
    <rect x="420" y="135" width="30" height="205" fill="#ff8f00"/>
    <text x="435" y="130">410</text>
    <text x="420" y="360" font-size="14">2021</text>

    <!-- 2022 (X=510) -->
    <!-- Wheat: 480 -> H: 240, Y: 100 -->
    <rect x="490" y="100" width="30" height="240" fill="#1e88e5"/>
    <text x="505" y="95">480</text>
    <!-- Rice: 500 -> H: 250, Y: 90 -->
    <rect x="520" y="90" width="30" height="250" fill="#ff8f00"/>
    <text x="535" y="85">500</text>
    <text x="520" y="360" font-size="14">2022</text>
  </g>
</svg>
