<svg xmlns="http://www.w3.org/2000/svg" width="650" height="400" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="650" height="400" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
  
  <text x="325" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#212121">Number of Visitors (in hundreds) to a Museum on Weekdays</text>

  <!-- Legend -->
  <rect x="230" y="50" width="15" height="15" fill="#ab47bc"/>
  <text x="255" y="62" font-size="12" fill="#212121">Adults</text>
  <rect x="330" y="50" width="15" height="15" fill="#26a69a"/>
  <text x="355" y="62" font-size="12" fill="#212121">Children</text>

  <!-- Y-Axis & X-Axis (Horizontal Bar Chart) -->
  <line x1="80" y1="80" x2="80" y2="350" stroke="#424242" stroke-width="2"/>
  <line x1="80" y1="350" x2="600" y2="350" stroke="#424242" stroke-width="2"/>

  <!-- X-Axis Grid & Labels (Values: 0 to 80, scaled by *6) -->
  <g font-size="12" fill="#616161" text-anchor="middle">
    <text x="80" y="365">0</text>
    <line x1="140" y1="80" x2="140" y2="350" stroke="#eeeeee" stroke-width="1"/>
    <text x="140" y="365">10</text>
    <line x1="200" y1="80" x2="200" y2="350" stroke="#eeeeee" stroke-width="1"/>
    <text x="200" y="365">20</text>
    <line x1="260" y1="80" x2="260" y2="350" stroke="#eeeeee" stroke-width="1"/>
    <text x="260" y="365">30</text>
    <line x1="320" y1="80" x2="320" y2="350" stroke="#eeeeee" stroke-width="1"/>
    <text x="320" y="365">40</text>
    <line x1="380" y1="80" x2="380" y2="350" stroke="#eeeeee" stroke-width="1"/>
    <text x="380" y="365">50</text>
    <line x1="440" y1="80" x2="440" y2="350" stroke="#eeeeee" stroke-width="1"/>
    <text x="440" y="365">60</text>
    <line x1="500" y1="80" x2="500" y2="350" stroke="#eeeeee" stroke-width="1"/>
    <text x="500" y="365">70</text>
    <line x1="560" y1="80" x2="560" y2="350" stroke="#eeeeee" stroke-width="1"/>
    <text x="560" y="365">80</text>
  </g>

  <!-- Bars and Values (Y intervals: 50, Y=100, 150, 200, 250, 300) -->
  <g font-size="12" font-weight="bold" fill="#424242" text-anchor="end">
    <text x="70" y="115">Monday</text>
    <text x="70" y="165">Tuesday</text>
    <text x="70" y="215">Wednes.</text>
    <text x="70" y="265">Thursday</text>
    <text x="70" y="315">Friday</text>
  </g>

  <g font-size="11" font-weight="bold" fill="#ffffff" text-anchor="start">
    <!-- Monday -->
    <!-- Adults: 45 -> W: 45*6 = 270 -->
    <rect x="80" y="95" width="270" height="15" fill="#ab47bc"/>
    <text x="85" y="107">45</text>
    <!-- Children: 30 -> W: 180 -->
    <rect x="80" y="110" width="180" height="15" fill="#26a69a"/>
    <text x="85" y="122">30</text>

    <!-- Tuesday -->
    <!-- Adults: 35 -> W: 210 -->
    <rect x="80" y="145" width="210" height="15" fill="#ab47bc"/>
    <text x="85" y="157">35</text>
    <!-- Children: 50 -> W: 300 -->
    <rect x="80" y="160" width="300" height="15" fill="#26a69a"/>
    <text x="85" y="172">50</text>

    <!-- Wednesday -->
    <!-- Adults: 55 -> W: 330 -->
    <rect x="80" y="195" width="330" height="15" fill="#ab47bc"/>
    <text x="85" y="207">55</text>
    <!-- Children: 40 -> W: 240 -->
    <rect x="80" y="210" width="240" height="15" fill="#26a69a"/>
    <text x="85" y="222">40</text>

    <!-- Thursday -->
    <!-- Adults: 40 -> W: 240 -->
    <rect x="80" y="245" width="240" height="15" fill="#ab47bc"/>
    <text x="85" y="257">40</text>
    <!-- Children: 25 -> W: 150 -->
    <rect x="80" y="260" width="150" height="15" fill="#26a69a"/>
    <text x="85" y="272">25</text>

    <!-- Friday -->
    <!-- Adults: 75 -> W: 450 -->
    <rect x="80" y="295" width="450" height="15" fill="#ab47bc"/>
    <text x="85" y="307">75</text>
    <!-- Children: 60 -> W: 360 -->
    <rect x="80" y="310" width="360" height="15" fill="#26a69a"/>
    <text x="85" y="322">60</text>
  </g>
</svg>
