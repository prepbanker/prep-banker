<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="600" height="350" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
  
  <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#212121">Percentage Distribution of Students in 5 Schools</text>
  <text x="300" y="50" text-anchor="middle" font-size="14" fill="#616161">Total Students = 15,000</text>

  <!-- Pie Chart Center: 200, 200, Radius: 120 -->
  <!-- Percentages: School A: 25%, B: 15%, C: 30%, D: 20%, E: 10% -->
  <!-- Angles (degrees): A: 90, B: 54, C: 108, D: 72, E: 36 -->
  <!-- Starting at -90 degrees (top) -->
  
  <g transform="translate(200, 200)">
    <!-- School A: 25% (90 deg). Path: from -90 to 0 -->
    <path d="M 0 0 L 0 -120 A 120 120 0 0 1 120 0 Z" fill="#ef5350" stroke="#fff" stroke-width="2"/>
    <text x="50" y="-50" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">A (25%)</text>
    
    <!-- School B: 15% (54 deg). Path: from 0 to 54 -->
    <!-- Cos(54) = 0.587, Sin(54) = 0.809 -->
    <!-- X = 120 * 0.587 = 70.44, Y = 120 * 0.809 = 97.08 -->
    <path d="M 0 0 L 120 0 A 120 120 0 0 1 70.44 97.08 Z" fill="#ab47bc" stroke="#fff" stroke-width="2"/>
    <text x="75" y="45" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">B (15%)</text>
    
    <!-- School C: 30% (108 deg). Path: from 54 to 162 -->
    <!-- Cos(162) = -0.951, Sin(162) = 0.309 -->
    <!-- X = 120 * -0.951 = -114.12, Y = 120 * 0.309 = 37.08 -->
    <path d="M 0 0 L 70.44 97.08 A 120 120 0 0 1 -114.12 37.08 Z" fill="#29b6f6" stroke="#fff" stroke-width="2"/>
    <text x="-40" y="70" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">C (30%)</text>
    
    <!-- School D: 20% (72 deg). Path: from 162 to 234 -->
    <!-- Cos(234) = -0.587, Sin(234) = -0.809 -->
    <!-- X = -70.44, Y = -97.08 -->
    <path d="M 0 0 L -114.12 37.08 A 120 120 0 0 1 -70.44 -97.08 Z" fill="#66bb6a" stroke="#fff" stroke-width="2"/>
    <text x="-90" y="-20" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">D (20%)</text>
    
    <!-- School E: 10% (36 deg). Path: from 234 to 270 (-90) -->
    <!-- Ends at 0, -120 -->
    <path d="M 0 0 L -70.44 -97.08 A 120 120 0 0 1 0 -120 Z" fill="#ffa726" stroke="#fff" stroke-width="2"/>
    <text x="-40" y="-85" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">E (10%)</text>
  </g>

  <!-- Legend Box -->
  <rect x="400" y="100" width="150" height="150" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" rx="5"/>
  <g font-size="13" fill="#424242">
    <rect x="415" y="115" width="15" height="15" fill="#ef5350"/>
    <text x="440" y="128">School A</text>
    
    <rect x="415" y="140" width="15" height="15" fill="#ab47bc"/>
    <text x="440" y="153">School B</text>
    
    <rect x="415" y="165" width="15" height="15" fill="#29b6f6"/>
    <text x="440" y="178">School C</text>
    
    <rect x="415" y="190" width="15" height="15" fill="#66bb6a"/>
    <text x="440" y="203">School D</text>
    
    <rect x="415" y="215" width="15" height="15" fill="#ffa726"/>
    <text x="440" y="228">School E</text>
  </g>
</svg>
