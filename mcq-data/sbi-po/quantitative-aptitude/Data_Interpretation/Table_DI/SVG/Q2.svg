<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="600" height="350" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Table Border -->
  <rect x="50" y="40" width="500" height="260" fill="none" stroke="#333333" stroke-width="2"/>
  
  <!-- Header Background -->
  <rect x="50" y="40" width="500" height="40" fill="#e3f2fd" stroke="#333333" stroke-width="1"/>
  
  <!-- Grid Lines (Horizontal) -->
  <line x1="50" y1="80" x2="550" y2="80" stroke="#333333" stroke-width="1"/>
  <line x1="50" y1="120" x2="550" y2="120" stroke="#cccccc" stroke-width="1"/>
  <line x1="50" y1="160" x2="550" y2="160" stroke="#cccccc" stroke-width="1"/>
  <line x1="50" y1="200" x2="550" y2="200" stroke="#cccccc" stroke-width="1"/>
  <line x1="50" y1="240" x2="550" y2="240" stroke="#cccccc" stroke-width="1"/>
  <line x1="50" y1="280" x2="550" y2="280" stroke="#cccccc" stroke-width="1"/>

  <!-- Grid Lines (Vertical) -->
  <line x1="150" y1="40" x2="150" y2="300" stroke="#333333" stroke-width="1"/>
  <line x1="250" y1="40" x2="250" y2="300" stroke="#333333" stroke-width="1"/>
  <line x1="350" y1="40" x2="350" y2="300" stroke="#333333" stroke-width="1"/>
  <line x1="450" y1="40" x2="450" y2="300" stroke="#333333" stroke-width="1"/>

  <!-- Headers -->
  <g font-size="14" font-weight="bold" fill="#0d47a1" text-anchor="middle">
    <text x="100" y="65">Store</text>
    <text x="200" y="65">Laptops</text>
    <text x="300" y="65">Mobiles</text>
    <text x="400" y="65">Tablets</text>
    <text x="500" y="65">Smartwatches</text>
  </g>

  <!-- Data Rows -->
  <g font-size="14" fill="#424242" text-anchor="middle">
    <!-- Store A -->
    <text x="100" y="105" font-weight="bold">Store A</text>
    <text x="200" y="105">120</text>
    <text x="300" y="105">450</text>
    <text x="400" y="105">180</text>
    <text x="500" y="105">90</text>

    <!-- Store B -->
    <text x="100" y="145" font-weight="bold">Store B</text>
    <text x="200" y="145">150</text>
    <text x="300" y="145">520</text>
    <text x="400" y="145">200</text>
    <text x="500" y="145">110</text>

    <!-- Store C -->
    <text x="100" y="185" font-weight="bold">Store C</text>
    <text x="200" y="185">90</text>
    <text x="300" y="185">380</text>
    <text x="400" y="185">160</text>
    <text x="500" y="185">85</text>

    <!-- Store D -->
    <text x="100" y="225" font-weight="bold">Store D</text>
    <text x="200" y="225">210</text>
    <text x="300" y="225">610</text>
    <text x="400" y="225">240</text>
    <text x="500" y="225">140</text>

    <!-- Store E -->
    <text x="100" y="265" font-weight="bold">Store E</text>
    <text x="200" y="265">180</text>
    <text x="300" y="265">490</text>
    <text x="400" y="265">210</text>
    <text x="500" y="265">125</text>
  </g>
</svg>
