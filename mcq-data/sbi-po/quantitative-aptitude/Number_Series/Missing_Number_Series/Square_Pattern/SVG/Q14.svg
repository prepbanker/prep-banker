<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" font-family="Arial, sans-serif">
  
  <rect x="10" y="10" width="580" height="230" fill="#fafafa" stroke="#bdbdbd" stroke-width="2" rx="4" />
  
  <text x="300" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Perfect Square Differential Map (Q14)</text>
  
  <!-- Base Series -->
  <g font-size="22" font-weight="bold" fill="#424242">
    <text x="70" y="150" text-anchor="middle">11</text>
    <text x="160" y="150" text-anchor="middle">20</text>
    <text x="250" y="150" text-anchor="middle">36</text>
    <text x="340" y="150" text-anchor="middle">61</text>
    <text x="430" y="150" text-anchor="middle">97</text>
    <text x="520" y="150" text-anchor="middle" fill="#d32f2f">146</text>
  </g>

  <!-- Difference Arcs Top -->
  <g stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#arrow-blue)">
    <defs>
      <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
      </marker>
    </defs>
    <path d="M 70 120 Q 115 80 160 120" />
    <path d="M 160 120 Q 205 80 250 120" />
    <path d="M 250 120 Q 295 80 340 120" />
    <path d="M 340 120 Q 385 80 430 120" />
    <path d="M 430 120 Q 475 80 520 120" stroke="#d32f2f" marker-end="url(#arrow-red)"/>
    <defs>
      <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#d32f2f"/>
      </marker>
    </defs>
  </g>

  <!-- Difference Values -->
  <g font-size="14" font-weight="bold" fill="#1565c0">
    <text x="115" y="95" text-anchor="middle">+9</text>
    <text x="205" y="95" text-anchor="middle">+16</text>
    <text x="295" y="95" text-anchor="middle">+25</text>
    <text x="385" y="95" text-anchor="middle">+36</text>
    <text x="475" y="95" text-anchor="middle" fill="#d32f2f">+49</text>
  </g>

  <!-- Algebraic Translation Bottom -->
  <g font-size="12" font-weight="bold" fill="#757575">
    <text x="115" y="180" text-anchor="middle">(3²)</text>
    <text x="205" y="180" text-anchor="middle">(4²)</text>
    <text x="295" y="180" text-anchor="middle">(5²)</text>
    <text x="385" y="180" text-anchor="middle">(6²)</text>
    <text x="475" y="180" text-anchor="middle" fill="#d32f2f">(7²)</text>
  </g>

</svg>
