<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" font-family="Arial, sans-serif">
  
  <rect x="10" y="10" width="580" height="230" fill="#fafafa" stroke="#bdbdbd" stroke-width="2" rx="4" />
  
  <text x="300" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Compound Multiplication-Addition Flow (Q15)</text>
  
  <!-- Base Series -->
  <g font-size="20" font-weight="bold" fill="#424242">
    <text x="70" y="100" text-anchor="middle">12</text>
    <text x="160" y="100" text-anchor="middle">13</text>
    <text x="250" y="100" text-anchor="middle">28</text>
    <text x="340" y="100" text-anchor="middle">87</text>
    <text x="430" y="100" text-anchor="middle">352</text>
    <text x="520" y="100" text-anchor="middle" fill="#d32f2f">1765</text>
  </g>

  <!-- Operation Blocks -->
  <g stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#arrow-blue)">
    <defs>
      <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
      </marker>
    </defs>
    <!-- Curve paths connecting numbers -->
    <path d="M 70 115 Q 115 155 160 115" />
    <path d="M 160 115 Q 205 155 250 115" />
    <path d="M 250 115 Q 295 155 340 115" />
    <path d="M 340 115 Q 385 155 430 115" />
    <path d="M 430 115 Q 475 155 520 115" stroke="#d32f2f" marker-end="url(#arrow-red)"/>
    <defs>
      <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#d32f2f"/>
      </marker>
    </defs>
  </g>

  <!-- Formula Overlay Texts -->
  <g font-size="14" font-weight="bold" fill="#0d47a1">
    <rect x="85" y="150" width="60" height="24" fill="#e3f2fd" stroke="#1565c0" stroke-width="1" rx="3" />
    <text x="115" y="167" text-anchor="middle">×1 +1</text>
    
    <rect x="175" y="150" width="60" height="24" fill="#e3f2fd" stroke="#1565c0" stroke-width="1" rx="3" />
    <text x="205" y="167" text-anchor="middle">×2 +2</text>

    <rect x="265" y="150" width="60" height="24" fill="#e3f2fd" stroke="#1565c0" stroke-width="1" rx="3" />
    <text x="295" y="167" text-anchor="middle">×3 +3</text>

    <rect x="355" y="150" width="60" height="24" fill="#e3f2fd" stroke="#1565c0" stroke-width="1" rx="3" />
    <text x="385" y="167" text-anchor="middle">×4 +4</text>

    <rect x="445" y="150" width="60" height="24" fill="#ffebee" stroke="#d32f2f" stroke-width="1" rx="3" />
    <text x="475" y="167" text-anchor="middle" fill="#b71c1c">×5 +5</text>
  </g>

  <!-- Bottom Legend -->
  <rect x="150" y="200" width="300" height="25" fill="#fff" stroke="#9e9e9e" stroke-dasharray="4,4" stroke-width="1" rx="4" />
  <text x="300" y="217" text-anchor="middle" font-size="12" font-weight="bold" fill="#616161">Algorithm: Multiply by n, then add n</text>

</svg>
