<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" font-family="Arial, sans-serif">
  
  <rect x="10" y="10" width="580" height="230" fill="#fafafa" stroke="#bdbdbd" stroke-width="2" rx="4" />
  
  <text x="300" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Algebraic Combinatorial Pattern (n³ - n²) (Q12)</text>
  
  <!-- Number Series Top -->
  <g font-size="22" font-weight="bold" fill="#424242">
    <text x="70" y="90" text-anchor="middle">0</text>
    <text x="160" y="90" text-anchor="middle">4</text>
    <text x="250" y="90" text-anchor="middle">18</text>
    <text x="340" y="90" text-anchor="middle">48</text>
    <text x="430" y="90" text-anchor="middle">100</text>
    <text x="520" y="90" text-anchor="middle" fill="#d32f2f">180</text>
  </g>

  <!-- Formula Boxes -->
  <g font-size="14" font-weight="bold">
    <rect x="30" y="130" width="80" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="5" />
    <text x="70" y="155" text-anchor="middle" fill="#0d47a1">1³ - 1²</text>
    
    <rect x="120" y="130" width="80" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="5" />
    <text x="160" y="155" text-anchor="middle" fill="#0d47a1">2³ - 2²</text>

    <rect x="210" y="130" width="80" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="5" />
    <text x="250" y="155" text-anchor="middle" fill="#0d47a1">3³ - 3²</text>

    <rect x="300" y="130" width="80" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="5" />
    <text x="340" y="155" text-anchor="middle" fill="#0d47a1">4³ - 4²</text>

    <rect x="390" y="130" width="80" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="5" />
    <text x="430" y="155" text-anchor="middle" fill="#0d47a1">5³ - 5²</text>

    <rect x="480" y="130" width="80" height="40" fill="#ffebee" stroke="#d32f2f" stroke-width="2" rx="5" />
    <text x="520" y="155" text-anchor="middle" fill="#b71c1c">6³ - 6²</text>
  </g>

  <!-- Connective Lines -->
  <g stroke="#9e9e9e" stroke-width="2" stroke-dasharray="4,4">
    <line x1="70" y1="100" x2="70" y2="130" />
    <line x1="160" y1="100" x2="160" y2="130" />
    <line x1="250" y1="100" x2="250" y2="130" />
    <line x1="340" y1="100" x2="340" y2="130" />
    <line x1="430" y1="100" x2="430" y2="130" />
    <line x1="520" y1="100" x2="520" y2="130" stroke="#d32f2f" />
  </g>

</svg>
