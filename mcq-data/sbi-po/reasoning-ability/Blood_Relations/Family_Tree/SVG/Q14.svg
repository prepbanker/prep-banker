<svg xmlns="http://www.w3.org/2000/svg" width="650" height="350" font-family="Arial, sans-serif">
  
  <rect x="10" y="10" width="630" height="330" fill="#fafafa" stroke="#bdbdbd" stroke-width="2" rx="4" />
  
  <!-- Marriage Lines (Double) -->
  <!-- U = P -->
  <line x1="270" y1="70" x2="330" y2="70" stroke="#d32f2f" stroke-width="3"/>
  <line x1="270" y1="76" x2="330" y2="76" stroke="#d32f2f" stroke-width="3"/>
  
  <!-- S = T -->
  <line x1="270" y1="170" x2="330" y2="170" stroke="#d32f2f" stroke-width="3"/>
  <line x1="270" y1="176" x2="330" y2="176" stroke="#d32f2f" stroke-width="3"/>
  
  <!-- Q = V -->
  <line x1="470" y1="170" x2="530" y2="170" stroke="#d32f2f" stroke-width="3"/>
  <line x1="470" y1="176" x2="530" y2="176" stroke="#d32f2f" stroke-width="3"/>
  
  <!-- Generation Lines (Vertical) -->
  <!-- From U=P to R, S, Q -->
  <line x1="300" y1="73" x2="300" y2="120" stroke="#424242" stroke-width="2"/>
  <line x1="100" y1="120" x2="450" y2="120" stroke="#424242" stroke-width="2"/>
  
  <!-- Drops to kids -->
  <line x1="100" y1="120" x2="100" y2="150" stroke="#424242" stroke-width="2"/>
  <line x1="250" y1="120" x2="250" y2="150" stroke="#424242" stroke-width="2"/>
  <line x1="450" y1="120" x2="450" y2="150" stroke="#424242" stroke-width="2"/>
  
  <!-- From S=T to M, O -->
  <line x1="300" y1="173" x2="300" y2="220" stroke="#424242" stroke-width="2"/>
  <line x1="250" y1="220" x2="350" y2="220" stroke="#424242" stroke-width="2"/>
  
  <!-- Drops to kids -->
  <line x1="250" y1="220" x2="250" y2="250" stroke="#424242" stroke-width="2"/>
  <line x1="350" y1="220" x2="350" y2="250" stroke="#424242" stroke-width="2"/>

  <!-- Nodes -->
  <!-- U (Male) -->
  <rect x="230" y="53" width="40" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="250" y="80" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">U</text>
  
  <!-- P (Female) -->
  <circle cx="350" cy="73" r="20" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="350" y="80" text-anchor="middle" font-size="20" font-weight="bold" fill="#880e4f">P</text>
  
  <!-- R (Male) -->
  <rect x="80" y="153" width="40" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="100" y="180" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">R</text>

  <!-- S (Male) -->
  <rect x="230" y="153" width="40" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="250" y="180" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">S</text>

  <!-- T (Female) -->
  <circle cx="350" cy="173" r="20" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="350" y="180" text-anchor="middle" font-size="20" font-weight="bold" fill="#880e4f">T</text>
  
  <!-- Q (Female) -->
  <circle cx="450" cy="173" r="20" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="450" y="180" text-anchor="middle" font-size="20" font-weight="bold" fill="#880e4f">Q</text>
  
  <!-- V (Male) -->
  <rect x="530" y="153" width="40" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="550" y="180" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">V</text>

  <!-- M (Female) -->
  <circle cx="250" cy="270" r="20" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="250" y="277" text-anchor="middle" font-size="20" font-weight="bold" fill="#880e4f">M</text>
  
  <!-- O (Male) -->
  <rect x="330" y="250" width="40" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="350" y="277" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">O</text>

</svg>
