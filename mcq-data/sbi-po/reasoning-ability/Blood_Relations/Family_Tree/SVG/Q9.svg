<svg xmlns="http://www.w3.org/2000/svg" width="550" height="350" font-family="Arial, sans-serif">
  
  <rect x="10" y="10" width="530" height="330" fill="#fafafa" stroke="#bdbdbd" stroke-width="2" rx="4" />
  
  <!-- Marriage Lines (Double) -->
  <!-- A = B -->
  <line x1="120" y1="70" x2="180" y2="70" stroke="#d32f2f" stroke-width="3"/>
  <line x1="120" y1="76" x2="180" y2="76" stroke="#d32f2f" stroke-width="3"/>
  
  <!-- D = E -->
  <line x1="170" y1="170" x2="330" y2="170" stroke="#d32f2f" stroke-width="3"/>
  <line x1="170" y1="176" x2="330" y2="176" stroke="#d32f2f" stroke-width="3"/>
  
  <!-- Generation Lines (Vertical) -->
  <!-- From A=B to C, D -->
  <line x1="150" y1="73" x2="150" y2="120" stroke="#424242" stroke-width="2"/>
  <line x1="100" y1="120" x2="150" y2="120" stroke="#424242" stroke-width="2"/>
  <line x1="100" y1="120" x2="100" y2="150" stroke="#424242" stroke-width="2"/>
  <line x1="150" y1="120" x2="150" y2="150" stroke="#424242" stroke-width="2"/>
  
  <!-- From H to F, E -->
  <line x1="400" y1="93" x2="400" y2="120" stroke="#424242" stroke-width="2"/>
  <line x1="350" y1="120" x2="450" y2="120" stroke="#424242" stroke-width="2"/>
  <line x1="350" y1="120" x2="350" y2="150" stroke="#424242" stroke-width="2"/>
  <line x1="450" y1="120" x2="450" y2="150" stroke="#424242" stroke-width="2"/>
  
  <!-- From D=E to G -->
  <line x1="250" y1="173" x2="250" y2="250" stroke="#424242" stroke-width="2"/>

  <!-- Nodes -->
  <!-- A (Female) -->
  <circle cx="100" cy="73" r="20" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="100" y="80" text-anchor="middle" font-size="20" font-weight="bold" fill="#880e4f">A</text>
  
  <!-- B (Male) -->
  <rect x="180" y="53" width="40" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="200" y="80" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">B</text>
  
  <!-- H (Male) -->
  <rect x="380" y="53" width="40" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="400" y="80" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">H</text>

  <!-- C (Female) -->
  <circle cx="100" cy="170" r="20" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="100" y="177" text-anchor="middle" font-size="20" font-weight="bold" fill="#880e4f">C</text>
  
  <!-- D (Male) -->
  <rect x="130" y="150" width="40" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="150" y="177" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">D</text>

  <!-- E (Female) -->
  <circle cx="350" cy="170" r="20" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="350" y="177" text-anchor="middle" font-size="20" font-weight="bold" fill="#880e4f">E</text>
  
  <!-- F (Female) -->
  <circle cx="450" cy="170" r="20" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="450" y="177" text-anchor="middle" font-size="20" font-weight="bold" fill="#880e4f">F</text>
  
  <!-- G (Female) -->
  <circle cx="250" cy="270" r="20" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="250" y="277" text-anchor="middle" font-size="20" font-weight="bold" fill="#880e4f">G</text>

</svg>
