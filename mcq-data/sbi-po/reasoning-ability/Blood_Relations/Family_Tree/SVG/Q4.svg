<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" font-family="Arial, sans-serif">
  
  <rect x="10" y="10" width="380" height="300" fill="#fafafa" stroke="#bdbdbd" stroke-width="2" rx="4" />
  
  <!-- Marriage Lines (Double) -->
  <line x1="170" y1="70" x2="230" y2="70" stroke="#d32f2f" stroke-width="3"/>
  <line x1="170" y1="76" x2="230" y2="76" stroke="#d32f2f" stroke-width="3"/>
  
  <line x1="220" y1="170" x2="280" y2="170" stroke="#d32f2f" stroke-width="3"/>
  <line x1="220" y1="176" x2="280" y2="176" stroke="#d32f2f" stroke-width="3"/>
  
  <!-- Generation Lines (Vertical) -->
  <line x1="200" y1="73" x2="200" y2="150" stroke="#424242" stroke-width="2"/>
  <line x1="250" y1="173" x2="250" y2="220" stroke="#424242" stroke-width="2"/>
  
  <!-- Sibling Bracket (Horizontal) -->
  <line x1="200" y1="220" x2="300" y2="220" stroke="#424242" stroke-width="2"/>
  <line x1="200" y1="220" x2="200" y2="250" stroke="#424242" stroke-width="2"/>
  <line x1="300" y1="220" x2="300" y2="250" stroke="#424242" stroke-width="2"/>

  <!-- Generation 1 Nodes -->
  <!-- P (Male -> Square) -->
  <rect x="130" y="53" width="40" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="150" y="80" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">P</text>
  
  <!-- Q (Female -> Circle) -->
  <circle cx="250" cy="73" r="20" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="250" y="80" text-anchor="middle" font-size="20" font-weight="bold" fill="#880e4f">Q</text>

  <!-- Generation 2 Nodes -->
  <!-- R (Male -> Square) -->
  <rect x="180" y="153" width="40" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="200" y="180" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">R</text>
  
  <!-- S (Female -> Circle) -->
  <circle cx="300" cy="173" r="20" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="300" y="180" text-anchor="middle" font-size="20" font-weight="bold" fill="#880e4f">S</text>

  <!-- Generation 3 Nodes -->
  <!-- T (Female -> Circle) -->
  <circle cx="200" cy="270" r="20" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="200" y="277" text-anchor="middle" font-size="20" font-weight="bold" fill="#880e4f">T</text>
  
  <!-- U (Male -> Square) -->
  <rect x="280" y="250" width="40" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="300" y="277" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">U</text>
  
  <!-- Legend -->
  <rect x="30" y="30" width="15" height="15" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
  <text x="50" y="43" font-size="12" fill="#424242">Male</text>
  
  <circle cx="37" cy="65" r="7.5" fill="#fce4ec" stroke="#c2185b" stroke-width="1"/>
  <text x="50" y="70" font-size="12" fill="#424242">Female</text>

</svg>
