<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" font-family="Arial, sans-serif">
  
  <rect x="10" y="10" width="580" height="230" fill="#fafafa" stroke="#bdbdbd" stroke-width="2" rx="4" />
  
  <text x="300" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Vowel/Consonant Variable Shift Mapping (Q12)</text>
  
  <!-- Base letters -->
  <g font-size="24" font-weight="bold" fill="#0d47a1">
    <text x="100" y="100" text-anchor="middle">B</text>
    <text x="233" y="100" text-anchor="middle">E</text>
    <text x="366" y="100" text-anchor="middle">K</text>
    <text x="500" y="100" text-anchor="middle">O</text>
  </g>
  
  <g font-size="12" fill="#757575">
    <text x="100" y="120" text-anchor="middle">Consonant</text>
    <text x="233" y="120" text-anchor="middle">Vowel</text>
    <text x="366" y="120" text-anchor="middle">Consonant</text>
    <text x="500" y="120" text-anchor="middle">Vowel</text>
  </g>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff9800"/>
    </marker>
  </defs>

  <g stroke="#ff9800" stroke-width="3" marker-end="url(#arrow)">
    <line x1="100" y1="130" x2="100" y2="170" />
    <line x1="233" y1="130" x2="233" y2="170" />
    <line x1="366" y1="130" x2="366" y2="170" />
    <line x1="500" y1="130" x2="500" y2="170" />
  </g>

  <!-- Shift Values -->
  <g font-size="14" font-weight="bold" fill="#e65100">
    <rect x="85" y="140" width="30" height="20" fill="#fff" stroke="#ff9800" rx="2"/>
    <text x="100" y="155" text-anchor="middle">+2</text>
    
    <rect x="218" y="140" width="30" height="20" fill="#fff" stroke="#ff9800" rx="2"/>
    <text x="233" y="155" text-anchor="middle">+3</text>
    
    <rect x="351" y="140" width="30" height="20" fill="#fff" stroke="#ff9800" rx="2"/>
    <text x="366" y="155" text-anchor="middle">+2</text>
    
    <rect x="485" y="140" width="30" height="20" fill="#fff" stroke="#ff9800" rx="2"/>
    <text x="500" y="155" text-anchor="middle">+3</text>
  </g>

  <!-- Resulting letters -->
  <g font-size="24" font-weight="bold" fill="#1b5e20">
    <text x="100" y="210" text-anchor="middle">D</text>
    <text x="233" y="210" text-anchor="middle">H</text>
    <text x="366" y="210" text-anchor="middle">M</text>
    <text x="500" y="210" text-anchor="middle">R</text>
  </g>

</svg>
