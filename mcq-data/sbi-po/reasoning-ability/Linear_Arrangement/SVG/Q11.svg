    <rect x="540" y="0" width="70" height="65" fill="#ffebee" rx="6" stroke="#c62828" stroke-width="2"/>
    <text x="575" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#b71c1c">F</text>
    <path d="M 575 40 L 575 55 M 570 50 L 575 55 L 580 50" stroke="#c62828" stroke-width="2" fill="none" stroke-linecap="round"/>
