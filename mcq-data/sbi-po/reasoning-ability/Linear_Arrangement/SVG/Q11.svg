  <!-- Relation lines indicating they face each other (Optional visual connector) -->
  <g stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="4,4">
    <line x1="60" y1="85" x2="60" y2="140"/>
    <line x1="150" y1="85" x2="150" y2="140"/>
    <line x1="240" y1="85" x2="240" y2="140"/>
    <line x1="330" y1="85" x2="330" y2="140"/>
    <line x1="420" y1="85" x2="420" y2="140"/>
    <line x1="510" y1="85" x2="510" y2="140"/>
    <line x1="600" y1="85" x2="600" y2="140"/>
  </g>
</svg>
