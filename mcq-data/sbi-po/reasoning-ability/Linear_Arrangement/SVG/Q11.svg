<svg xmlns="http://www.w3.org/2000/svg" width="670" height="240" font-family="Arial, sans-serif">
  <!-- Top Row (South Facing) -->
  <g transform="translate(25, 20)">
    <!-- G -->
    <rect x="0" y="0" width="70" height="65" fill="#ffebee" rx="6" stroke="#c62828" stroke-width="2"/>
    <text x="35" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#b71c1c">G</text>
    <path d="M 35 40 L 35 55 M 30 50 L 35 55 L 40 50" stroke="#c62828" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- E -->
    <rect x="90" y="0" width="70" height="65" fill="#ffebee" rx="6" stroke="#c62828" stroke-width="2"/>
    <text x="125" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#b71c1c">E</text>
    <path d="M 125 40 L 125 55 M 120 50 L 125 55 L 130 50" stroke="#c62828" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- B -->
    <rect x="180" y="0" width="70" height="65" fill="#ffebee" rx="6" stroke="#c62828" stroke-width="2"/>
    <text x="215" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#b71c1c">B</text>
    <path d="M 215 40 L 215 55 M 210 50 L 215 55 L 220 50" stroke="#c62828" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- D -->
    <rect x="270" y="0" width="70" height="65" fill="#ffebee" rx="6" stroke="#c62828" stroke-width="2"/>
    <text x="305" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#b71c1c">D</text>
    <path d="M 305 40 L 305 55 M 300 50 L 305 55 L 310 50" stroke="#c62828" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- C -->
    <rect x="360" y="0" width="70" height="65" fill="#ffebee" rx="6" stroke="#c62828" stroke-width="2"/>
    <text x="395" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#b71c1c">C</text>
    <path d="M 395 40 L 395 55 M 390 50 L 395 55 L 400 50" stroke="#c62828" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- A -->
    <rect x="450" y="0" width="70" height="65" fill="#ffebee" rx="6" stroke="#c62828" stroke-width="2"/>
    <text x="485" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#b71c1c">A</text>
    <path d="M 485 40 L 485 55 M 480 50 L 485 55 L 490 50" stroke="#c62828" stroke-width="2" fill="none" stroke-linecap="round"/>

