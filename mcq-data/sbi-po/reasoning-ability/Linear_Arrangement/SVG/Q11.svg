  <!-- Bottom Row (North Facing) -->
  <g transform="translate(25, 140)">
    <!-- U -->
    <rect x="0" y="0" width="70" height="65" fill="#e3f2fd" rx="6" stroke="#1565c0" stroke-width="2"/>
    <text x="35" y="50" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">U</text>
    <path d="M 35 25 L 35 10 M 30 15 L 35 10 L 40 15" stroke="#1565c0" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- S -->
    <rect x="90" y="0" width="70" height="65" fill="#e3f2fd" rx="6" stroke="#1565c0" stroke-width="2"/>
    <text x="125" y="50" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">S</text>
    <path d="M 125 25 L 125 10 M 120 15 L 125 10 L 130 15" stroke="#1565c0" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- T -->
    <rect x="180" y="0" width="70" height="65" fill="#e3f2fd" rx="6" stroke="#1565c0" stroke-width="2"/>
    <text x="215" y="50" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">T</text>
    <path d="M 215 25 L 215 10 M 210 15 L 215 10 L 220 15" stroke="#1565c0" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Q -->
    <rect x="270" y="0" width="70" height="65" fill="#e3f2fd" rx="6" stroke="#1565c0" stroke-width="2"/>
    <text x="305" y="50" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">Q</text>
    <path d="M 305 25 L 305 10 M 300 15 L 305 10 L 310 15" stroke="#1565c0" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- P -->
    <rect x="360" y="0" width="70" height="65" fill="#e3f2fd" rx="6" stroke="#1565c0" stroke-width="2"/>
    <text x="395" y="50" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">P</text>
    <path d="M 395 25 L 395 10 M 390 15 L 395 10 L 400 15" stroke="#1565c0" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- V -->
    <rect x="450" y="0" width="70" height="65" fill="#e3f2fd" rx="6" stroke="#1565c0" stroke-width="2"/>
    <text x="485" y="50" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">V</text>
    <path d="M 485 25 L 485 10 M 480 15 L 485 10 L 490 15" stroke="#1565c0" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- R -->
    <rect x="540" y="0" width="70" height="65" fill="#e3f2fd" rx="6" stroke="#1565c0" stroke-width="2"/>
    <text x="575" y="50" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">R</text>
    <path d="M 575 25 L 575 10 M 570 15 L 575 10 L 580 15" stroke="#1565c0" stroke-width="2" fill="none" stroke-linecap="round"/>
