<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" font-family="Arial, sans-serif">
  
  <rect x="10" y="10" width="580" height="230" fill="#fafafa" stroke="#bdbdbd" stroke-width="2" rx="4" />
  
  <text x="300" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Overlapping Linear Ranking (Q13)</text>
  
  <!-- Number Line -->
  <line x1="50" y1="120" x2="550" y2="120" stroke="#b0bec5" stroke-width="4" stroke-linecap="round" />
  
  <text x="50" y="150" font-size="14" font-weight="bold" fill="#607d8b">Left (1)</text>
  <text x="500" y="150" font-size="14" font-weight="bold" fill="#607d8b">Right (50)</text>

  <!-- Total 50 Bar -->
  <line x1="50" y1="170" x2="550" y2="170" stroke="#9e9e9e" stroke-width="2" />
  <line x1="50" y1="165" x2="50" y2="175" stroke="#9e9e9e" stroke-width="2" />
  <line x1="550" y1="165" x2="550" y2="175" stroke="#9e9e9e" stroke-width="2" />
  <text x="300" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#424242">Total = 50 Students</text>

  <!-- Person B (Overlaps to the left of A) -->
  <g transform="translate(150, 120)">
    <circle cx="0" cy="0" r="8" fill="#d32f2f" stroke="#fff" stroke-width="2"/>
    <text x="0" y="-15" text-anchor="middle" font-size="16" font-weight="bold" fill="#b71c1c">B</text>
  </g>
  
  <!-- Person A -->
  <g transform="translate(450, 120)">
    <circle cx="0" cy="0" r="8" fill="#1565c0" stroke="#fff" stroke-width="2"/>
    <text x="0" y="-15" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">A</text>
  </g>

  <!-- Distance Arrows -->
  <g stroke-width="2" stroke-linecap="round">
    <!-- Rank A from Left -->
    <path d="M 50 80 Q 250 50 445 80" fill="none" stroke="#1565c0" />
    <polygon points="450,80 440,75 442,85" fill="#1565c0" />
    <text x="250" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">35th from Left</text>
    
    <!-- Rank B from Right -->
    <path d="M 550 80 Q 350 50 155 80" fill="none" stroke="#d32f2f" />
    <polygon points="150,80 160,75 158,85" fill="#d32f2f" />
    <text x="350" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#d32f2f">40th from Right</text>
  </g>

  <!-- Overlap Region -->
  <line x1="165" y1="120" x2="435" y2="120" stroke="#ff9800" stroke-width="6" stroke-linecap="round" />
  <text x="300" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">Overlap = 23 Students</text>

</svg>
