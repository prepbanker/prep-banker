<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1976d2"/>
    </marker>
  </defs>

  <!-- Title / Label for Middle Row -->
  <text x="300" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#757575" font-style="italic">Reversed Word</text>

  <!-- Letters -->
  <!-- Top Row: BASKET -->
  <g font-size="24" font-weight="bold" fill="#212121" text-anchor="middle">
    <text x="100" y="80">B</text>
    <text x="180" y="80">A</text>
    <text x="260" y="80">S</text>
    <text x="340" y="80">K</text>
    <text x="420" y="80">E</text>
    <text x="500" y="80">T</text>
  </g>

  <!-- Middle Row: TEKSAB -->
  <g font-size="24" font-weight="bold" fill="#f57c00" text-anchor="middle">
    <text x="100" y="210">T</text>
    <text x="180" y="210">E</text>
    <text x="260" y="210">K</text>
    <text x="340" y="210">S</text>
    <text x="420" y="210">A</text>
    <text x="500" y="210">B</text>
  </g>

  <!-- Bottom Row: UFLTBC -->
  <g font-size="24" font-weight="bold" fill="#388e3c" text-anchor="middle">
    <text x="100" y="340">U</text>
    <text x="180" y="340">F</text>
    <text x="260" y="340">L</text>
    <text x="340" y="340">T</text>
    <text x="420" y="340">B</text>
    <text x="500" y="340">C</text>
  </g>

  <!-- Arrows and Labels (+1) -->
  <g stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)">
    <line x1="100" y1="230" x2="100" y2="290"/>
    <line x1="180" y1="230" x2="180" y2="290"/>
    <line x1="260" y1="230" x2="260" y2="290"/>
    <line x1="340" y1="230" x2="340" y2="290"/>
    <line x1="420" y1="230" x2="420" y2="290"/>
    <line x1="500" y1="230" x2="500" y2="290"/>
  </g>

  <g font-size="14" font-weight="bold" fill="#1976d2" text-anchor="middle">
    <text x="115" y="265">+1</text>
    <text x="195" y="265">+1</text>
    <text x="275" y="265">+1</text>
    <text x="355" y="265">+1</text>
    <text x="435" y="265">+1</text>
    <text x="515" y="265">+1</text>
  </g>

</svg>
