<svg xmlns="http://www.w3.org/2000/svg" width="650" height="400" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1976d2"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b1fa2"/>
    </marker>
  </defs>

  <!-- Pair Separators -->
  <line x1="180" y1="50" x2="180" y2="350" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="330" y1="50" x2="330" y2="350" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="480" y1="50" x2="480" y2="350" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Top Row: HOSPITAL -->
  <g font-size="24" font-weight="bold" fill="#212121" text-anchor="middle">
    <text x="80" y="80">H</text>
    <text x="130" y="80">O</text>
    <text x="230" y="80">S</text>
    <text x="280" y="80">P</text>
    <text x="380" y="80">I</text>
    <text x="430" y="80">T</text>
    <text x="530" y="80">A</text>
    <text x="580" y="80">L</text>
  </g>

  <!-- Criss-Cross Arrows for Reversal -->
  <g stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)">
    <!-- HO -->
    <line x1="80" y1="100" x2="125" y2="170"/>
    <line x1="130" y1="100" x2="85" y2="170"/>
    <!-- SP -->
    <line x1="230" y1="100" x2="275" y2="170"/>
    <line x1="280" y1="100" x2="235" y2="170"/>
    <!-- IT -->
    <line x1="380" y1="100" x2="425" y2="170"/>
    <line x1="430" y1="100" x2="385" y2="170"/>
    <!-- AL -->
    <line x1="530" y1="100" x2="575" y2="170"/>
    <line x1="580" y1="100" x2="535" y2="170"/>
  </g>

  <!-- Middle Row: OH PS TI LA -->
  <g font-size="24" font-weight="bold" fill="#f57c00" text-anchor="middle">
    <text x="80" y="210">O</text>
    <text x="130" y="210">H</text>
    <text x="230" y="210">P</text>
    <text x="280" y="210">S</text>
    <text x="380" y="210">T</text>
    <text x="430" y="210">I</text>
    <text x="530" y="210">L</text>
    <text x="580" y="210">A</text>
  </g>

  <!-- Vertical Arrows for +2 Shift -->
  <g stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrow-purple)">
    <line x1="80" y1="230" x2="80" y2="290"/>
    <line x1="130" y1="230" x2="130" y2="290"/>
    <line x1="230" y1="230" x2="230" y2="290"/>
    <line x1="280" y1="230" x2="280" y2="290"/>
    <line x1="380" y1="230" x2="380" y2="290"/>
    <line x1="430" y1="230" x2="430" y2="290"/>
    <line x1="530" y1="230" x2="530" y2="290"/>
    <line x1="580" y1="230" x2="580" y2="290"/>
  </g>

  <!-- Labels for +2 -->
  <g font-size="12" font-weight="bold" fill="#7b1fa2" text-anchor="middle">
    <text x="95" y="265">+2</text>
    <text x="145" y="265">+2</text>
    <text x="245" y="265">+2</text>
    <text x="295" y="265">+2</text>
    <text x="395" y="265">+2</text>
    <text x="445" y="265">+2</text>
    <text x="545" y="265">+2</text>
    <text x="595" y="265">+2</text>
  </g>

  <!-- Bottom Row: QJ RU VK NC -->
  <g font-size="24" font-weight="bold" fill="#4a148c" text-anchor="middle">
    <text x="80" y="340">Q</text>
    <text x="130" y="340">J</text>
    <text x="230" y="340">R</text>
    <text x="280" y="340">U</text>
    <text x="380" y="340">V</text>
    <text x="430" y="340">K</text>
    <text x="530" y="340">N</text>
    <text x="580" y="340">C</text>
  </g>

</svg>
