<svg xmlns="http://www.w3.org/2000/svg" width="380" height="240" font-family="Arial, sans-serif">

  <!-- Header Row -->
  <rect x="20" y="10" width="100" height="36" fill="#283593" rx="3"/>
  <rect x="130" y="10" width="100" height="36" fill="#283593" rx="3"/>
  <rect x="240" y="10" width="120" height="36" fill="#283593" rx="3"/>
  <text x="70"  y="33" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Position</text>
  <text x="180" y="33" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Box</text>
  <text x="300" y="33" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Colour</text>

  <!-- Position 5 (Top) -->
  <rect x="20" y="46" width="100" height="36" fill="#c5cae9" rx="2"/>
  <rect x="130" y="46" width="100" height="36" fill="#e8eaf6" rx="2"/>
  <rect x="240" y="46" width="120" height="36" fill="#e8eaf6" rx="2"/>
  <text x="70"  y="69" text-anchor="middle" font-size="12" fill="#1a237e" font-weight="bold">5 (Top)</text>
  <text x="180" y="69" text-anchor="middle" font-size="12" fill="#333">Box E</text>
  <text x="300" y="69" text-anchor="middle" font-size="12" fill="#333">Red</text>

  <!-- Position 4 -->
  <rect x="20" y="82" width="100" height="36" fill="#c5cae9" rx="2"/>
  <rect x="130" y="82" width="100" height="36" fill="#e8eaf6" rx="2"/>
  <rect x="240" y="82" width="120" height="36" fill="#e8eaf6" rx="2"/>
  <text x="70"  y="105" text-anchor="middle" font-size="12" fill="#1a237e" font-weight="bold">4</text>
  <text x="180" y="105" text-anchor="middle" font-size="12" fill="#333">Box A</text>
  <text x="300" y="105" text-anchor="middle" font-size="12" fill="#333">Green</text>

  <!-- Position 3 -->
  <rect x="20" y="118" width="100" height="36" fill="#c5cae9" rx="2"/>
  <rect x="130" y="118" width="100" height="36" fill="#e8eaf6" rx="2"/>
  <rect x="240" y="118" width="120" height="36" fill="#e8eaf6" rx="2"/>
  <text x="70"  y="141" text-anchor="middle" font-size="12" fill="#1a237e" font-weight="bold">3</text>
  <text x="180" y="141" text-anchor="middle" font-size="12" fill="#333">Box B</text>
  <text x="300" y="141" text-anchor="middle" font-size="12" fill="#333">White</text>

  <!-- Position 2 -->
  <rect x="20" y="154" width="100" height="36" fill="#c5cae9" rx="2"/>
  <rect x="130" y="154" width="100" height="36" fill="#e8eaf6" rx="2"/>
  <rect x="240" y="154" width="120" height="36" fill="#e8eaf6" rx="2"/>
  <text x="70"  y="177" text-anchor="middle" font-size="12" fill="#1a237e" font-weight="bold">2</text>
  <text x="180" y="177" text-anchor="middle" font-size="12" fill="#333">Box D</text>
  <text x="300" y="177" text-anchor="middle" font-size="12" fill="#333">Blue</text>

  <!-- Position 1 (Bottom) -->
  <rect x="20" y="190" width="100" height="36" fill="#c5cae9" rx="2"/>
  <rect x="130" y="190" width="100" height="36" fill="#e8eaf6" rx="2"/>
  <rect x="240" y="190" width="120" height="36" fill="#e8eaf6" rx="2"/>
  <text x="70"  y="213" text-anchor="middle" font-size="12" fill="#1a237e" font-weight="bold">1 (Bottom)</text>
  <text x="180" y="213" text-anchor="middle" font-size="12" fill="#333">Box C</text>
  <text x="300" y="213" text-anchor="middle" font-size="12" fill="#333">Yellow</text>

</svg>
