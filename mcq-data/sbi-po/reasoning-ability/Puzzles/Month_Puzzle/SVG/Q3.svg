<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" font-family="Arial, sans-serif">

  <!-- Header Row -->
  <rect x="20" y="10" width="140" height="36" fill="#283593" rx="3"/>
  <rect x="170" y="10" width="130" height="36" fill="#283593" rx="3"/>
  <text x="90"  y="33" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Month</text>
  <text x="235" y="33" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Person</text>

  <!-- February -->
  <rect x="20" y="46" width="140" height="36" fill="#c5cae9" rx="2"/>
  <rect x="170" y="46" width="130" height="36" fill="#e8eaf6" rx="2"/>
  <text x="90"  y="69" text-anchor="middle" font-size="12" fill="#1a237e" font-weight="bold">February</text>
  <text x="235" y="69" text-anchor="middle" font-size="12" fill="#333">R</text>

  <!-- April -->
  <rect x="20" y="82" width="140" height="36" fill="#c5cae9" rx="2"/>
  <rect x="170" y="82" width="130" height="36" fill="#e8eaf6" rx="2"/>
  <text x="90"  y="105" text-anchor="middle" font-size="12" fill="#1a237e" font-weight="bold">April</text>
  <text x="235" y="105" text-anchor="middle" font-size="12" fill="#333">P</text>

  <!-- July -->
  <rect x="20" y="118" width="140" height="36" fill="#c5cae9" rx="2"/>
  <rect x="170" y="118" width="130" height="36" fill="#e8eaf6" rx="2"/>
  <text x="90"  y="141" text-anchor="middle" font-size="12" fill="#1a237e" font-weight="bold">July</text>
  <text x="235" y="141" text-anchor="middle" font-size="12" fill="#333">Q</text>

  <!-- October -->
  <rect x="20" y="154" width="140" height="36" fill="#c5cae9" rx="2"/>
  <rect x="170" y="154" width="130" height="36" fill="#e8eaf6" rx="2"/>
  <text x="90"  y="177" text-anchor="middle" font-size="12" fill="#1a237e" font-weight="bold">October</text>
  <text x="235" y="177" text-anchor="middle" font-size="12" fill="#333">S</text>

  <!-- December -->
  <rect x="20" y="190" width="140" height="36" fill="#c5cae9" rx="2"/>
  <rect x="170" y="190" width="130" height="36" fill="#e8eaf6" rx="2"/>
  <text x="90"  y="213" text-anchor="middle" font-size="12" fill="#1a237e" font-weight="bold">December</text>
  <text x="235" y="213" text-anchor="middle" font-size="12" fill="#333">T</text>

</svg>
