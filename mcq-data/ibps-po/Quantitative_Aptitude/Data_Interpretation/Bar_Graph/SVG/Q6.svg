<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450">
  <!-- Horizontal Grouped Bar Chart -->
  <rect width="100%" height="100%" fill="#f9f9f9"/>
  
  <line x1="100" y1="50" x2="100" y2="400" stroke="#000" stroke-width="2"/>
  <line x1="100" y1="400" x2="650" y2="400" stroke="#000" stroke-width="2"/>

  <!-- X axis labels (0 to 500, spacing 100px = 100 units) -->
  <text x="100" y="420" text-anchor="middle" font-family="sans-serif" font-size="12">0</text>
  <text x="200" y="420" text-anchor="middle" font-family="sans-serif" font-size="12">100</text>
  <text x="300" y="420" text-anchor="middle" font-family="sans-serif" font-size="12">200</text>
  <text x="400" y="420" text-anchor="middle" font-family="sans-serif" font-size="12">300</text>
  <text x="500" y="420" text-anchor="middle" font-family="sans-serif" font-size="12">400</text>
  <text x="600" y="420" text-anchor="middle" font-family="sans-serif" font-size="12">500</text>

  <line x1="200" y1="50" x2="200" y2="400" stroke="#e0e0e0" stroke-dasharray="4"/>
  <line x1="300" y1="50" x2="300" y2="400" stroke="#e0e0e0" stroke-dasharray="4"/>
  <line x1="400" y1="50" x2="400" y2="400" stroke="#e0e0e0" stroke-dasharray="4"/>
  <line x1="500" y1="50" x2="500" y2="400" stroke="#e0e0e0" stroke-dasharray="4"/>
  <line x1="600" y1="50" x2="600" y2="400" stroke="#e0e0e0" stroke-dasharray="4"/>

  <!-- Legend -->
  <rect x="250" y="20" width="15" height="15" fill="#2ecc71"/>
  <text x="275" y="32" font-family="sans-serif" font-size="14">January</text>
  <rect x="360" y="20" width="15" height="15" fill="#9b59b6"/>
  <text x="385" y="32" font-family="sans-serif" font-size="14">February</text>

  <!-- S1: Jan=300, Feb=250 -->
  <text x="80" y="85" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold">S1</text>
  <rect x="100" y="65" width="300" height="20" fill="#2ecc71"/>
  <rect x="100" y="85" width="250" height="20" fill="#9b59b6"/>

  <!-- S2: Jan=450, Feb=420 -->
  <text x="80" y="155" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold">S2</text>
  <rect x="100" y="135" width="450" height="20" fill="#2ecc71"/>
  <rect x="100" y="155" width="420" height="20" fill="#9b59b6"/>

  <!-- S3: Jan=250, Feb=320 -->
  <text x="80" y="225" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold">S3</text>
  <rect x="100" y="205" width="250" height="20" fill="#2ecc71"/>
  <rect x="100" y="225" width="320" height="20" fill="#9b59b6"/>

  <!-- S4: Jan=350, Feb=380 -->
  <text x="80" y="295" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold">S4</text>
  <rect x="100" y="275" width="350" height="20" fill="#2ecc71"/>
  <rect x="100" y="295" width="380" height="20" fill="#9b59b6"/>

  <!-- S5: Jan=400, Feb=400 -->
  <text x="80" y="365" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold">S5</text>
  <rect x="100" y="345" width="400" height="20" fill="#2ecc71"/>
  <rect x="100" y="365" width="400" height="20" fill="#9b59b6"/>

</svg>