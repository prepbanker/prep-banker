<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450">
  <!-- Stacked Bar Chart -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <line x1="80" y1="380" x2="650" y2="380" stroke="#000" stroke-width="2"/>
  <line x1="80" y1="80" x2="80" y2="380" stroke="#000" stroke-width="2"/>

  <!-- Y axis grid and labels. Max total is V4 = 3600. Let's make top 4000. 1 unit = 0.075px (300px/4000) -->
  <!-- Let's say 4000 -> 300px height. So y=80 is 4000, y=380 is 0. -->
  <line x1="80" y1="305" x2="650" y2="305" stroke="#e0e0e0" stroke-dasharray="4"/> <!-- 1000 -->
  <line x1="80" y1="230" x2="650" y2="230" stroke="#e0e0e0" stroke-dasharray="4"/> <!-- 2000 -->
  <line x1="80" y1="155" x2="650" y2="155" stroke="#e0e0e0" stroke-dasharray="4"/> <!-- 3000 -->
  <line x1="80" y1="80" x2="650" y2="80" stroke="#e0e0e0" stroke-dasharray="4"/>  <!-- 4000 -->

  <text x="70" y="385" text-anchor="end" font-family="sans-serif" font-size="14">0</text>
  <text x="70" y="310" text-anchor="end" font-family="sans-serif" font-size="14">1000</text>
  <text x="70" y="235" text-anchor="end" font-family="sans-serif" font-size="14">2000</text>
  <text x="70" y="160" text-anchor="end" font-family="sans-serif" font-size="14">3000</text>
  <text x="70" y="85" text-anchor="end" font-family="sans-serif" font-size="14">4000</text>

  <!-- Legend -->
  <rect x="260" y="30" width="15" height="15" fill="#f1c40f"/>
  <text x="285" y="43" font-family="sans-serif" font-size="14">Valid Votes</text>
  <rect x="390" y="30" width="15" height="15" fill="#e67e22"/>
  <text x="415" y="43" font-family="sans-serif" font-size="14">Invalid Votes</text>

  <!-- V1: Valid=2000 (150px), Invalid=500 (37.5px) -->
  <rect x="130" y="230" width="50" height="150" fill="#f1c40f"/>
  <rect x="130" y="192.5" width="50" height="37.5" fill="#e67e22"/>
  <text x="155" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">V1</text>

  <!-- V2: Valid=2500 (187.5px), Invalid=500 (37.5px) -->
  <rect x="230" y="192.5" width="50" height="187.5" fill="#f1c40f"/>
  <rect x="230" y="155" width="50" height="37.5" fill="#e67e22"/>
  <text x="255" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">V2</text>

  <!-- V3: Valid=1800 (135px), Invalid=600 (45px) -->
  <rect x="330" y="245" width="50" height="135" fill="#f1c40f"/>
  <rect x="330" y="200" width="50" height="45" fill="#e67e22"/>
  <text x="355" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">V3</text>

  <!-- V4: Valid=3000 (225px), Invalid=600 (45px) -->
  <rect x="430" y="155" width="50" height="225" fill="#f1c40f"/>
  <rect x="430" y="110" width="50" height="45" fill="#e67e22"/>
  <text x="455" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">V4</text>

  <!-- V5: Valid=2200 (165px), Invalid=300 (22.5px) -->
  <rect x="530" y="215" width="50" height="165" fill="#f1c40f"/>
  <rect x="530" y="192.5" width="50" height="22.5" fill="#e67e22"/>
  <text x="555" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">V5</text>

</svg>