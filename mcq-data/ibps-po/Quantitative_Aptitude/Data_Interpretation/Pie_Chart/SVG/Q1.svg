<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <!-- Pie Chart 1: A(20), B(25), C(18), D(30), E(7) -->
  <!-- Angles: A(72), B(90), C(64.8), D(108), E(25.2) -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <text x="250" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold">Percentage Distribution of Students (Total = 2500)</text>

  <!-- Pie center at 200, 220, r=120 -->
  <!-- A: 0 to 72 -->
  <path d="M 200,220 L 320,220 A 120,120 0 0,1 237.08,334.12 Z" fill="#3498db" stroke="#fff" stroke-width="2"/>
  
  <!-- B: 72 to 162 -->
  <path d="M 200,220 L 237.08,334.12 A 120,120 0 0,1 85.88,257.08 Z" fill="#e74c3c" stroke="#fff" stroke-width="2"/>
  
  <!-- C: 162 to 226.8 -->
  <path d="M 200,220 L 85.88,257.08 A 120,120 0 0,1 117.84,132.34 Z" fill="#2ecc71" stroke="#fff" stroke-width="2"/>
  
  <!-- D: 226.8 to 334.8 -->
  <path d="M 200,220 L 117.84,132.34 A 120,120 0 0,1 308.57,169.04 Z" fill="#f1c40f" stroke="#fff" stroke-width="2"/>
  
  <!-- E: 334.8 to 360 -->
  <path d="M 200,220 L 308.57,169.04 A 120,120 0 0,1 320,220 Z" fill="#9b59b6" stroke="#fff" stroke-width="2"/>

  <!-- Legend -->
  <rect x="370" y="120" width="15" height="15" fill="#3498db"/>
  <text x="395" y="133" font-family="sans-serif" font-size="14">School A (20%)</text>

  <rect x="370" y="150" width="15" height="15" fill="#e74c3c"/>
  <text x="395" y="163" font-family="sans-serif" font-size="14">School B (25%)</text>

  <rect x="370" y="180" width="15" height="15" fill="#2ecc71"/>
  <text x="395" y="193" font-family="sans-serif" font-size="14">School C (18%)</text>

  <rect x="370" y="210" width="15" height="15" fill="#f1c40f"/>
  <text x="395" y="223" font-family="sans-serif" font-size="14">School D (30%)</text>

  <rect x="370" y="240" width="15" height="15" fill="#9b59b6"/>
  <text x="395" y="253" font-family="sans-serif" font-size="14">School E (7%)</text>
</svg>