<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <!-- Pie Chart 2: Rent(22), Food(35), Edu(15), Travel(10), Save(18) -->
  <!-- Angles: Rent(79.2), Food(126), Edu(54), Travel(36), Save(64.8) -->
  <!-- Cum angles: 79.2, 205.2, 259.2, 295.2, 360 -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <text x="250" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold">Monthly Expenses (Total = Rs. 40,000)</text>

  <!-- Rent: 0 to 79.2 -->
  <path d="M 200,220 L 320,220 A 120,120 0 0,1 222.48,337.87 Z" fill="#1abc9c" stroke="#fff" stroke-width="2"/>
  
  <!-- Food: 79.2 to 205.2 -->
  <path d="M 200,220 L 222.48,337.87 A 120,120 0 0,1 91.42,168.85 Z" fill="#e67e22" stroke="#fff" stroke-width="2"/>
  
  <!-- Edu: 205.2 to 259.2 -->
  <path d="M 200,220 L 91.42,168.85 A 120,120 0 0,1 177.51,102.13 Z" fill="#34495e" stroke="#fff" stroke-width="2"/>
  
  <!-- Travel: 259.2 to 295.2 -->
  <path d="M 200,220 L 177.51,102.13 A 120,120 0 0,1 251.09,111.48 Z" fill="#95a5a6" stroke="#fff" stroke-width="2"/>
  
  <!-- Save: 295.2 to 360 -->
  <path d="M 200,220 L 251.09,111.48 A 120,120 0 0,1 320,220 Z" fill="#3498db" stroke="#fff" stroke-width="2"/>

  <!-- Legend -->
  <rect x="370" y="120" width="15" height="15" fill="#1abc9c"/>
  <text x="395" y="133" font-family="sans-serif" font-size="14">Rent (22%)</text>

  <rect x="370" y="150" width="15" height="15" fill="#e67e22"/>
  <text x="395" y="163" font-family="sans-serif" font-size="14">Food (35%)</text>

  <rect x="370" y="180" width="15" height="15" fill="#34495e"/>
  <text x="395" y="193" font-family="sans-serif" font-size="14">Education (15%)</text>

  <rect x="370" y="210" width="15" height="15" fill="#95a5a6"/>
  <text x="395" y="223" font-family="sans-serif" font-size="14">Travel (10%)</text>

  <rect x="370" y="240" width="15" height="15" fill="#3498db"/>
  <text x="395" y="253" font-family="sans-serif" font-size="14">Savings (18%)</text>
</svg>