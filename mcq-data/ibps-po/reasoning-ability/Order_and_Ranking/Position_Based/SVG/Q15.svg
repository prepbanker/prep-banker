<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150">
    <rect width="100%" height="100%" fill="#ffffff" />
    
    <!-- Row Line -->
    <line x1="50" y1="75" x2="550" y2="75" stroke="#333" stroke-width="4" stroke-linecap="round" />
    
    <!-- Ends -->
    <text x="30" y="80" font-family="Arial" font-size="14" font-weight="bold">L</text>
    <text x="560" y="80" font-family="Arial" font-size="14" font-weight="bold">R</text>

    <!-- Markers -->
    <circle cx="150" cy="75" r="8" fill="#f44336" />
    <text x="145" y="55" font-family="Arial" font-size="14" font-weight="bold">A (22)</text>
    
    <circle cx="300" cy="75" r="8" fill="#2196f3" />
    <text x="295" y="55" font-family="Arial" font-size="14" font-weight="bold">C (?)</text>
    
    <circle cx="450" cy="75" r="8" fill="#4caf50" />
    <text x="445" y="55" font-family="Arial" font-size="14" font-weight="bold">B (42)</text>
    
    <!-- Segments -->
    <path d="M 150,90 Q 225,120 300,90" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="4,4" />
    <text x="210" y="125" font-family="Arial" font-size="12">10 positions</text>
    
    <path d="M 300,90 Q 375,120 450,90" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="4,4" />
    <text x="360" y="125" font-family="Arial" font-size="12">10 positions</text>
    
    <!-- Info -->
    <text x="300" y="25" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Total Students = 60</text>
</svg>