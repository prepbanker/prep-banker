<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 250 180">
    <rect width="100%" height="100%" fill="#ffffff" />
    <!-- Grid -->
    <g stroke="#e0e0e0" stroke-width="1">
        <line x1="-20" y1="20" x2="230" y2="20" />
        <line x1="-20" y1="70" x2="230" y2="70" />
        <line x1="-20" y1="120" x2="230" y2="120" />
        <line x1="-20" y1="170" x2="230" y2="170" />
        <line x1="30" y1="-20" x2="30" y2="180" />
        <line x1="80" y1="-20" x2="80" y2="180" />
        <line x1="130" y1="-20" x2="130" y2="180" />
        <line x1="180" y1="-20" x2="180" y2="180" />
        <line x1="230" y1="-20" x2="230" y2="180" />
    </g>
    <!-- Path -->
    <polyline points="30,120 30,20 230,20 230,170 130,170 130,120" fill="none" stroke="#4a148c" stroke-width="3" stroke-linejoin="round" />
    <line x1="30" y1="120" x2="130" y2="120" stroke="#f44336" stroke-width="3" stroke-dasharray="6,4" />
    
    <!-- Points -->
    <circle cx="30" cy="120" r="5" fill="#d32f2f" />
    <text x="15" y="125" font-family="Arial" font-size="12" font-weight="bold">A</text>
    
    <circle cx="30" cy="20" r="5" fill="#1976d2" />
    <text x="15" y="25" font-family="Arial" font-size="12" font-weight="bold">B</text>
    
    <circle cx="230" cy="20" r="5" fill="#1976d2" />
    <text x="240" y="25" font-family="Arial" font-size="12" font-weight="bold">C</text>
    
    <circle cx="230" cy="170" r="5" fill="#1976d2" />
    <text x="240" y="175" font-family="Arial" font-size="12" font-weight="bold">D</text>
    
    <circle cx="130" cy="170" r="5" fill="#1976d2" />
    <text x="125" y="188" font-family="Arial" font-size="12" font-weight="bold">E</text>
    
    <circle cx="130" cy="120" r="5" fill="#d32f2f" />
    <text x="135" y="115" font-family="Arial" font-size="12" font-weight="bold">F</text>
    
    <!-- Labels -->
    <text x="35" y="70" font-family="Arial" font-size="10" fill="#333">10m</text>
    <text x="120" y="15" font-family="Arial" font-size="10" fill="#333">20m</text>
    <text x="235" y="95" font-family="Arial" font-size="10" fill="#333">15m</text>
    <text x="175" y="165" font-family="Arial" font-size="10" fill="#333">10m</text>
    <text x="110" y="145" font-family="Arial" font-size="10" fill="#333">5m</text>
    <text x="75" y="115" font-family="Arial" font-size="10" fill="#f44336">10m?</text>
</svg>