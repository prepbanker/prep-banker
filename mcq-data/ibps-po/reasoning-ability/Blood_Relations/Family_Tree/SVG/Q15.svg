<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
    <rect width="100%" height="100%" fill="#ffffff" />
    <g font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">
        <!-- Gen 1 -->
        <rect x="80" y="30" width="40" height="40" fill="#e0f7fa" stroke="#006064" stroke-width="2" />
        <text x="100" y="55">J(+)</text>
        
        <circle cx="180" cy="50" r="20" fill="#fce4ec" stroke="#880e4f" stroke-width="2" />
        <text x="180" y="55">L(-)</text>
        <line x1="120" y1="50" x2="160" y2="50" stroke="#333" stroke-width="2" stroke-dasharray="5,5" />
        
        <rect x="300" y="30" width="40" height="40" fill="#e0f7fa" stroke="#006064" stroke-width="2" />
        <text x="320" y="55">K(+)</text>
        
        <!-- Gen 2 -->
        <line x1="140" y1="50" x2="140" y2="100" stroke="#333" stroke-width="2" />
        <rect x="120" y="100" width="40" height="40" fill="#e0f7fa" stroke="#006064" stroke-width="2" />
        <text x="140" y="125">M(+)</text>
        
        <line x1="320" y1="70" x2="320" y2="90" stroke="#333" stroke-width="2" />
        <line x1="240" y1="90" x2="360" y2="90" stroke="#333" stroke-width="2" />
        
        <line x1="240" y1="90" x2="240" y2="100" stroke="#333" stroke-width="2" />
        <circle cx="240" cy="120" r="20" fill="#fce4ec" stroke="#880e4f" stroke-width="2" />
        <text x="240" y="125">N(-)</text>
        
        <line x1="360" y1="90" x2="360" y2="100" stroke="#333" stroke-width="2" />
        <rect x="340" y="100" width="40" height="40" fill="#e0f7fa" stroke="#006064" stroke-width="2" />
        <text x="360" y="125">O(+)</text>

        <!-- Marriage Gen 2 -->
        <line x1="160" y1="120" x2="220" y2="120" stroke="#333" stroke-width="2" stroke-dasharray="5,5" />
        
        <!-- Gen 3 -->
        <line x1="190" y1="120" x2="190" y2="180" stroke="#333" stroke-width="2" />
        <line x1="150" y1="180" x2="230" y2="180" stroke="#333" stroke-width="2" />
        
        <line x1="150" y1="180" x2="150" y2="200" stroke="#333" stroke-width="2" />
        <rect x="130" y="200" width="40" height="40" fill="#e0f7fa" stroke="#006064" stroke-width="2" />
        <text x="150" y="225">P(+)</text>
        
        <line x1="230" y1="180" x2="230" y2="200" stroke="#333" stroke-width="2" />
        <circle cx="230" cy="220" r="20" fill="#fce4ec" stroke="#880e4f" stroke-width="2" />
        <text x="230" y="225">Q(-)</text>
    </g>
</svg>